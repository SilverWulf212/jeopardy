services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jeopardy
      POSTGRES_USER: jeopardy
      POSTGRES_PASSWORD: jeopardy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeopardy -d jeopardy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jeopardy:jeopardy@db:5432/jeopardy
      PORT: "3001"
      NODE_ENV: production
    ports:
      - "3001:3001"

volumes:
  pgdata:
